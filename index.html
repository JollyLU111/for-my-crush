<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Crush</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: #ffe6e6; font-family: sans-serif; overflow: hidden;
        }
        .container { text-align: center; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #gif { width: 200px; margin-bottom: 20px; transition: 0.3s; }
        h1 { color: #d63384; font-size: 2rem; padding: 0 20px; }
        .button-group { position: relative; width: 100%; height: 200px; margin-top: 20px; }
        .btn {
            padding: 15px 30px; font-size: 1.1rem; border: none; border-radius: 50px;
            cursor: pointer; position: absolute; transition: all 0.2s ease;
            white-space: nowrap;
        }
        #yesBtn { 
            background-color: #ff4d6d; color: white; 
            left: 50%; top: 50%; transform: translate(-120%, -50%); 
            z-index: 100;
        }
        #noBtn { 
            background-color: #6c757d; color: white; 
            left: 50%; top: 50%; transform: translate(20%, -50%); 
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="gif" src="https://i.pinimg.com/originals/01/df/7f/01df7f2337097617c8e34c15802b077f.gif">
        <h1 id="question">Làm người yêu tớ nhé 😘</h1>
        <div class="button-group">
            <button id="yesBtn" class="btn">Có</button>
            <button id="noBtn" class="btn">Không</button>
        </div>
    </div>

<script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const question = document.getElementById('question');
    const gif = document.getElementById('gif');

    let yesSize = 1.1; 
    let noSize = 1.1;
    let clickCount = 0;

    // Danh sách các câu nói khi bấm "Không"
    const messages = [
        "Cậu chắc chưa?? 🤨",
        "Suy nghĩ kỹ lại đi mà... 🥺",
        "Tớ buồn lắm đó nha! 💔",
        "Cho cậu một cơ hội nữa đấy 😤",
        "Ơ kìa, sao lại bấm vào đây? 😢",
        "Nút 'Có' to thế kia màaaaa",
        "Thôi mà, đồng ý đi mà... 🙏"
    ];

    function moveButton() {
        const padding = 50;
        const maxX = window.innerWidth - noBtn.clientWidth - padding;
        const maxY = window.innerHeight - noBtn.clientHeight - padding;
        
        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        noBtn.style.position = 'fixed';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
        noBtn.style.transform = 'none'; 
    }

    noBtn.addEventListener('click', () => {
        moveButton();

        // 1. Thay đổi dòng chữ ngẫu nhiên hoặc theo thứ tự
        question.innerHTML = messages[clickCount % messages.length];
        clickCount++;

        // 2. Nút CÓ to dần, nút KHÔNG nhỏ dần
        yesSize += 0.4;
        noSize -= 0.15;
        
        yesBtn.style.fontSize = yesSize + 'rem';
        yesBtn.style.padding = (15 * yesSize) + 'px ' + (30 * yesSize) + 'px';
        
        if (noSize > 0.3) {
            noBtn.style.fontSize = noSize + 'rem';
            noBtn.style.padding = (10 * noSize) + 'px ' + (20 * noSize) + 'px';
        } else {
            noBtn.style.display = 'none'; // Nhỏ quá thì bắt buộc ấn CÓ
            question.innerHTML = "Hết đường lui rồi nhé! 😎";
        }
    });

    yesBtn.addEventListener('click', () => {
        question.innerHTML = "Tớ biết ngay mà! Love youuu ❤️";
        // Link ảnh GIF mới (ổn định hơn)
        gif.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHJueGZueXF4eXF4eXF4&ep=v1_gifs_search&rid=giphy.gif&ct=g";
        noBtn.style.display = 'none';

        // Pháo hoa
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
        });
    });
</script>
</body>
</html>
