<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Crush</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: #ffe6e6; font-family: sans-serif; overflow: hidden;
        }
        .container { text-align: center; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #gif { width: 200px; margin-bottom: 20px; transition: 0.3s; }
        h1 { color: #d63384; font-size: 2rem; padding: 0 20px; }
        .button-group { position: relative; width: 100%; height: 200px; margin-top: 20px; }
        .btn {
            padding: 15px 30px; font-size: 1.1rem; border: none; border-radius: 50px;
            cursor: pointer; position: absolute; transition: all 0.2s ease;
            white-space: nowrap;
        }
        #yesBtn { 
            background-color: #ff4d6d; color: white; 
            left: 50%; top: 50%; transform: translate(-120%, -50%); 
            z-index: 100;
        }
        #noBtn { 
            background-color: #6c757d; color: white; 
            left: 50%; top: 50%; transform: translate(20%, -50%); 
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="gif" src="https://i.pinimg.com/originals/01/df/7f/01df7f2337097617c8e34c15802b077f.gif">
        <h1 id="question">Cậu có thích tôi không ??</h1>
        <div class="button-group">
            <button id="yesBtn" class="btn">Có</button>
            <button id="noBtn" class="btn">Không</button>
        </div>
    </div>

    <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const question = document.getElementById('question');
    const gif = document.getElementById('gif');

    let yesSize = 1.1; 
    let noSize = 1.1;

    function moveButton() {
        // Giới hạn vùng nhảy: Cách mép màn hình ít nhất 50px để không bị mất nút
        const padding = 50;
        const maxX = window.innerWidth - noBtn.clientWidth - padding;
        const maxY = window.innerHeight - noBtn.clientHeight - padding;
        
        // Đảm bảo tọa độ không bao giờ nhỏ hơn padding
        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        noBtn.style.position = 'fixed'; // Dùng fixed để nó luôn tính theo khung hình
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
        noBtn.style.transform = 'none'; 
    }

    noBtn.addEventListener('click', () => {
        moveButton();

        // Nút CÓ to dần, nút KHÔNG nhỏ dần
        yesSize += 0.4; // Tăng độ to cho nhanh kịch tính
        noSize -= 0.15;
        
        yesBtn.style.fontSize = yesSize + 'rem';
        // Tăng padding để nút CÓ phình ra to hơn nữa
        yesBtn.style.padding = (15 * yesSize) + 'px ' + (30 * yesSize) + 'px';
        
        if (noSize > 0.3) {
            noBtn.style.fontSize = noSize + 'rem';
            noBtn.style.padding = (10 * noSize) + 'px ' + (20 * noSize) + 'px';
        } else {
            noBtn.style.display = 'none'; // Nhỏ quá thì cho biến mất luôn, bắt buộc ấn CÓ
        }
    });

    yesBtn.addEventListener('click', () => {
        question.innerHTML = "Tớ biết ngay mà! Love youuu ❤️";
        gif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueXF4eXF4eXF4&ep=v1_gifs_search&rid=giphy.gif";
        noBtn.style.display = 'none';

        // Bắn pháo hoa
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
        });
        
        // Bắn thêm đợt nữa cho rực rỡ
        setTimeout(() => {
            confetti({
                particleCount: 100,
                spread: 100,
                origin: { x: 0.3, y: 0.5 }
            });
            confetti({
                particleCount: 100,
                spread: 100,
                origin: { x: 0.7, y: 0.5 }
            });
        }, 300);
    });
</script>
</body>
</html>
