<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Crush</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe6e6;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container { text-align: center; position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #gif { width: 200px; margin-bottom: 20px; }
        h1 { color: #d63384; font-size: 2rem; }
        .button-group { position: relative; width: 300px; height: 100px; margin-top: 20px; }
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: absolute; /* Rất quan trọng */
            transition: all 0.1s ease;
        }
        #yesBtn { background-color: #ff4d6d; color: white; left: 20px; }
        #noBtn { background-color: #6c757d; color: white; right: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img id="gif" src="https://i.pinimg.com/originals/01/df/7f/01df7f2337097617c8e34c15802b077f.gif">
        <h1 id="question">Cậu có thích tôi không ??</h1>
        <div class="button-group">
            <button id="yesBtn" class="btn">Có</button>
            <button id="noBtn" class="btn">Không</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const gif = document.getElementById('gif');

        // Nút Không nhảy khi di chuột (cho máy tính)
        noBtn.addEventListener('mouseover', moveButton);
        // Nút Không nhảy khi chạm (cho điện thoại)
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.clientWidth);
            const y = Math.random() * (window.innerHeight - noBtn.clientHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        yesBtn.addEventListener('click', () => {
            question.innerHTML = "Tớ biết ngay mà! Love youuu ❤️";
            gif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueXF4eXF4eXF4&ep=v1_gifs_search&rid=giphy.gif";
            noBtn.style.display = 'none';
        });
    </script>
</body>
</html>
