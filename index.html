<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Crush ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #gif {
            width: 220px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 30px;
            padding: 0 15px;
            min-height: 3rem; /* Giữ chỗ cho text khi đổi */
        }
        .button-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            height: 100px;
        }
        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 999; /* Luôn nằm trên */
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <img id="gif" src="https://i.pinimg.com/originals/01/df/7f/01df7f2337097617c8e34c15802b077f.gif" alt="Cute Bear">
        <h1 id="question">Làm người yêu tớ nhé 😘</h1>
        <div class="button-group">
            <button id="yesBtn" class="btn">Có</button>
            <button id="noBtn" class="btn">Không</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const gif = document.getElementById('gif');

        let yesSize = 1.1; 
        let noSize = 1.1;
        let clickCount = 0;

        const messages = [
            "Ơ kìa, suy nghĩ lại đi... 🥺",
            "Cậu chắc chưa đó?? 🤨",
            "Tớ buồn lắm đó nha! 💔",
            "Cho cậu một cơ hội nữa đấy 😤",
            "Bấm lộn đúng không, bấm lại đi 😢",
            "Nút Có to thế mà không thấy àaaaa",
            "Đừng từ chối mà... 🙏",
            "Hết đường lui rồi nhé! 😎"
        ];

        // Hàm nhảy của nút Không
        function moveButton() {
            const padding = 60;
            const maxX = window.innerWidth - noBtn.clientWidth - padding;
            const maxY = window.innerHeight - noBtn.clientHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.margin = '0';
        }

        // Sự kiện khi bấm nút KHÔNG
        noBtn.addEventListener('click', () => {
            moveButton();

            // Đổi câu hỏi
            question.innerHTML = messages[Math.min(clickCount, messages.length - 1)];
            clickCount++;

            // Phóng to nút CÓ
            yesSize += 0.5;
            yesBtn.style.fontSize = yesSize + 'rem';
            yesBtn.style.padding = (15 * (yesSize/1.1)) + 'px ' + (35 * (yesSize/1.1)) + 'px';
            
            // Thu nhỏ nút KHÔNG
            noSize -= 0.15;
            if (noSize > 0.4) {
                noBtn.style.fontSize = noSize + 'rem';
                noBtn.style.padding = (15 * (noSize/1.1)) + 'px ' + (35 * (noSize/1.1)) + 'px';
            } else {
                noBtn.style.opacity = '0.7';
                if (noSize <= 0.2) noBtn.style.display = 'none'; // Biến mất luôn khi quá nhỏ
            }
        });

        // Sự kiện khi bấm nút CÓ
        yesBtn.addEventListener('click', () => {
            question.innerHTML = "Tớ biết ngay mà! Love youuu ❤️";
            gif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueXF4eXF4eXF4&ep=v1_gifs_search&rid=giphy.gif&ct=g";
            noBtn.style.display = 'none';

            // Hiệu ứng pháo hoa rực rỡ
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;

            (function frame() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return;

                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4d6d', '#ffffff', '#ff85a1']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4d6d', '#ffffff', '#ff85a1']
                });

                requestAnimationFrame(frame);
            }());
        });
    </script>
</body>
</html>
